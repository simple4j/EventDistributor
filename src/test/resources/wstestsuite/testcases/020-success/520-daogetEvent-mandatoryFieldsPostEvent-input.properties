TypeOfStep=org.simple4j.wsfeeler.model.BeanShellStep


eventIdIn=./020-daogetEvents/mandatoryFieldsEventId


ASSERT=org.simple4j.eventdistributor.dao.EventDistributorMapper eventDAO\=testApplicationContext.getBean("eventDistributorMapper", org.simple4j.eventdistributor.dao.EventDistributorMapper.class); \
org.simple4j.eventdistributor.beans.Event event \= eventDAO.getEvent(Long.parseLong(eventIdIn)); \
org.simple4j.eventdistributor.beans.EventStatus.SUCCESS.equals(event.getStatus()) && \
event.getPublishAttempts() != null && \
event.getPublishAttempts().size() == 2 && \
event.getCreateTime()!\=null && \
event.getUpdateTime()!\=null && \
!event.getCreateTime().equals(event.getUpdateTime()) && \
event.getPublishAttempts().get(0) != null && \
event.getPublishAttempts().get(1) != null && \
event.getPublishAttempts().get(0).getErrorDetails() == null && \
event.getPublishAttempts().get(1).getErrorDetails() == null && \
( \
	( \
		"system1".equals(event.getPublishAttempts().get(0).getTargetId()) \
		&& \
		"system2".equals(event.getPublishAttempts().get(1).getTargetId()) \
	) \
	|| \
	( \
		"system1".equals(event.getPublishAttempts().get(1).getTargetId()) \
		&& \
		"system2".equals(event.getPublishAttempts().get(2).getTargetId()) \
	) \
)

